# {repo}/.dw/config.yml
tracker:
  backend: do-work-io # or linear
  dowork:
    base_url: https://example
    token_env: DOWORK_IO_PAT
    project: your-slug
    mcp_profile: dowork.control
  linear:
    team_id: ""
    product_project: ""
    status_map:
      backlog: Todo
      in_progress: In Progress
      stopped: Canceled
      done: Done
models:
  # Orchestrator = the session running /dw (Opus 5.5).
  default: sonnet # Maker: make, debug, fixes
  available:
    sonnet:
      id: claude-sonnet-5-5
      via: host
    opus: # Checker: first non-default key
      id: claude-opus-5-5
      via: host
